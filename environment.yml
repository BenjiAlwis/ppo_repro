name: ppo-repro

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.7

  # PyTorch with CUDA (GPU build)
  - pytorch>=2.1
  - torchvision
  - pytorch-cuda=12.1

  
  - glew
  - glfw
  - mesalib
  - patchelf

  - pip:
      - "gymnasium[mujoco]>=1.0"
      - tensorboard>=2.14
      
